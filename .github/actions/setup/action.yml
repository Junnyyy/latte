name: Setup
description: Install Bun and the locked dependencies through Socket Firewall.

outputs:
  firewall-report:
    description: Path to the Socket Firewall report JSON
    value: ${{ steps.socket.outputs.firewall-path-report }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - id: socket
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free

    - shell: bash
      run: sfw bun install --frozen-lockfile

    - shell: bash
      run: |
        cat "$SFW_JSON_REPORT_PATH"
        echo "--- env sfw injects"
        diff <(env | sort) <(sfw env | sort) | grep -v -E 'TOKEN|SECRET' || true
        echo "--- dead proxy control"
        rm -rf node_modules ~/.bun/install/cache
        HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 bun install --frozen-lockfile 2>&1 | tail -5 || true
        echo "--- verbose sfw install"
        rm -rf node_modules ~/.bun/install/cache
        sfw bun install --frozen-lockfile --verbose 2>&1 | grep -i -E 'proxy|127\.0\.0\.1|localhost|registry' | head -20 || true
        ls node_modules | wc -l
